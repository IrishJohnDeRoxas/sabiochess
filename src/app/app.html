<div class="min-h-screen flex flex-col bg-[#D9D9D9] text-[#222222]">
  <!-- Neubrutalist Header -->
  <app-header></app-header>

  <!-- Main Game Arena (Fills initial viewport cleanly) -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex flex-col justify-center min-h-[calc(100vh-64px)]">
    
    <!-- Arena Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center my-auto">
      
      <!-- Board Area: Top Player + [Eval Bar + Chess Board] + Bottom Player (lg:col-span-7) -->
      <div class="lg:col-span-7 flex flex-col w-full max-w-[640px] mx-auto lg:max-w-none">
        
        <!-- Top Player Card -->
        <app-player-card
          class="mb-2 sm:mb-2.5 block"
          [player]="game.topPlayer()"
          [color]="game.topColor()"
          [isTurn]="game.isTopTurn()"
          [capturedPieces]="game.topCapturedPieces()"
          [materialAdvantage]="game.topMaterialAdvantage()"
          [timeControl]="game.matchMetadata().timeControl"
        ></app-player-card>

        <!-- Board Row: Eval Bar + Chess Board (matching exact height) -->
        <div 
          class="grid gap-2.5 sm:gap-3 items-stretch w-full"
          [ngClass]="settings.showEvalBar() ? 'grid-cols-[36px_1fr] sm:grid-cols-[44px_1fr]' : 'grid-cols-1'"
        >
          <!-- Eval Bar Column -->
          @if (settings.showEvalBar()) {
            <div class="w-full h-full min-h-0 relative">
              <app-eval-bar class="w-full h-full block"></app-eval-bar>
            </div>
          }

          <!-- Main Chess Board -->
          <div class="w-full min-w-0">
            <app-chess-board></app-chess-board>
          </div>
        </div>

        <!-- Bottom Player Card -->
        <app-player-card
          class="mt-3 sm:mt-3.5 block"
          [player]="game.bottomPlayer()"
          [color]="game.bottomColor()"
          [isTurn]="game.isBottomTurn()"
          [capturedPieces]="game.bottomCapturedPieces()"
          [materialAdvantage]="game.bottomMaterialAdvantage()"
          [timeControl]="game.matchMetadata().timeControl"
        ></app-player-card>

      </div>

      <!-- Sidebar Tabs (lg:col-span-5): Review, Analysis, Settings -->
      <div class="lg:col-span-5 w-full max-w-[640px] mx-auto lg:max-w-none">
        <app-sidebar-tabs></app-sidebar-tabs>
      </div>

    </div>

  </main>

  <!-- Neubrutalist Footer (Pushed down below the first screen fold) -->
  <app-footer class="mt-16 sm:mt-24"></app-footer>
</div>
