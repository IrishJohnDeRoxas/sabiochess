<header
  class="w-full bg-[#FFFFFF] dark:bg-[#1E1E1E] border-b-[4px] border-[#222222] dark:border-black shadow-[0_4px_0_0_#222222] dark:shadow-[0_4px_0_0_#000000] px-3 py-2.5 sm:px-6 lg:px-8 transition-colors duration-150 relative z-30">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
    <!-- Brand / Logo Area -->
    <a [routerLink]="['/']" (click)="closeMobileMenu()" class="inline-block no-underline">
      <app-logo size="md"></app-logo>
    </a>

    <!-- Actions Area (Desktop) -->
    <div class="hidden md:flex items-center gap-3 shrink-0">
      <!-- Theme Toggle Button -->
      <button type="button" (click)="toggleTheme()"
        class="btn-brutal btn-brutal-silver !py-2 !px-3 text-xs sm:text-sm flex items-center justify-center cursor-pointer"
        [title]="settings.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        aria-label="Toggle Theme">
        <app-icon [name]="settings.isDarkMode() ? 'sun' : 'moon'" size="w-4 h-4"></app-icon>
      </button>

      <!-- Buy Me a Coffee Button (Refined Muted Gold / Neubrutalist Outline) -->
      <button type="button" (click)="openSupportModal()"
        class="btn-brutal bg-[#FEF3C7] dark:bg-[#262626] text-[#92400E] dark:text-[#FBBF24] border-2 border-[#222222] dark:border-[#F59E0B]/60 hover:bg-[#FDE68A] dark:hover:bg-[#333333] !py-2 !px-4 text-xs sm:text-sm flex items-center justify-center font-accent font-black cursor-pointer shadow-[3px_3px_0_0_#222222] dark:shadow-[3px_3px_0_0_#000000] active:translate-x-0.5 active:translate-y-0.5 transition-all shrink-0">
        <span class="tracking-wider">☕ BUY ME A COFFEE</span>
      </button>
    </div>

    <!-- Burger Menu Button (Mobile only: < md) -->
    <div class="flex md:hidden items-center shrink-0" #mobileMenuContainer>
      <button
        type="button"
        (click)="toggleMobileMenu($event)"
        class="btn-brutal !py-2 !px-2.5 text-xs font-bold flex items-center justify-center cursor-pointer shadow-[2px_2px_0_0_#222222] dark:shadow-[2px_2px_0_0_#000000]"
        [ngClass]="isMobileMenuOpen() ? 'bg-[#FF4F00] text-white border-[#222222] dark:border-black' : 'bg-white dark:bg-[#262626] text-[#222222] dark:text-[#F3F4F6]'"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Toggle Mobile Navigation Menu"
      >
        <app-icon [name]="isMobileMenuOpen() ? 'x-mark' : 'bars-3'" size="w-5 h-5"></app-icon>
      </button>

      <!-- Neubrutalist Mobile Dropdown Menu -->
      @if (isMobileMenuOpen()) {
        <!-- Backdrop Overlay for Mobile -->
        <div (click)="closeMobileMenu()" class="fixed inset-0 top-[54px] bg-black/40 z-40 md:hidden animate-fadeIn"></div>

        <!-- Dropdown Container -->
        <div class="fixed md:absolute right-3 top-[60px] md:top-[calc(100%+8px)] z-50 w-[calc(100vw-1.5rem)] max-w-xs bg-white dark:bg-[#1E1E1E] border-[3px] border-[#222222] dark:border-black shadow-[6px_6px_0_0_#222222] dark:shadow-[6px_6px_0_0_#000000] p-3.5 flex flex-col gap-2.5 animate-scale-up">
          <!-- Buy Me a Coffee Button (Full Width Muted Gold) -->
          <button
            type="button"
            (click)="openSupportModal()"
            class="btn-brutal bg-[#FEF3C7] dark:bg-[#262626] text-[#92400E] dark:text-[#FBBF24] border-2 border-[#222222] dark:border-[#F59E0B]/60 hover:bg-[#FDE68A] dark:hover:bg-[#333333] w-full !py-2.5 !px-3 text-xs font-accent font-black flex items-center justify-center cursor-pointer shadow-[3px_3px_0_0_#222222] dark:shadow-[3px_3px_0_0_#000000]"
          >
            <span class="tracking-wider uppercase">☕ BUY ME A COFFEE</span>
          </button>

          <!-- Theme Toggle Row -->
          <div
            (click)="toggleTheme()"
            class="flex items-center justify-between p-2.5 bg-[#ECECD8] dark:bg-[#262626] border-2 border-[#222222] dark:border-black cursor-pointer hover:bg-[#D9D9D9] dark:hover:bg-[#333333] transition-colors"
          >
            <span class="font-accent font-bold text-xs uppercase text-[#222222] dark:text-[#F3F4F6]">
              {{ settings.isDarkMode() ? 'DARK MODE' : 'LIGHT MODE' }}
            </span>
            <span class="btn-brutal btn-brutal-silver !py-1 !px-2 text-xs flex items-center gap-1">
              <app-icon [name]="settings.isDarkMode() ? 'sun' : 'moon'" size="w-3.5 h-3.5"></app-icon>
              <span>SWITCH</span>
            </span>
          </div>

          <!-- Navigation Links -->
          <div class="grid grid-cols-3 gap-1.5 pt-1 border-t-2 border-[#222222] dark:border-[#373A46] text-center">
            <a
              [routerLink]="['/changelog']"
              (click)="closeMobileMenu()"
              class="btn-brutal !py-1.5 !px-1 text-[10px] font-label font-bold text-[#222222] dark:text-[#F3F4F6] bg-[#ECECD8] dark:bg-[#262626] no-underline"
            >
              CHANGELOG
            </a>
            <a
              [routerLink]="['/terms']"
              (click)="closeMobileMenu()"
              class="btn-brutal !py-1.5 !px-1 text-[10px] font-label font-bold text-[#222222] dark:text-[#F3F4F6] bg-[#ECECD8] dark:bg-[#262626] no-underline"
            >
              TERMS
            </a>
            <a
              [routerLink]="['/privacy']"
              (click)="closeMobileMenu()"
              class="btn-brutal !py-1.5 !px-1 text-[10px] font-label font-bold text-[#222222] dark:text-[#F3F4F6] bg-[#ECECD8] dark:bg-[#262626] no-underline"
            >
              PRIVACY
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</header>
