<header
  class="w-full bg-[#FFFFFF] dark:bg-[#1E1F24] border-b-[4px] border-[#222222] dark:border-black shadow-[0_4px_0_0_#222222] dark:shadow-[0_4px_0_0_#000000] px-4 py-3 sm:px-6 lg:px-8 transition-colors duration-150">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
    <!-- Brand / Logo Area -->
    <app-logo size="md"></app-logo>

    <!-- Center / Status (Energy & Mode) -->
    <div class="hidden md:flex items-center gap-3">
      <div class="badge-brutal bg-[#D9D9D9] dark:bg-[#2A2B32] text-[#222222] dark:text-[#F3F4F6] flex items-center gap-2 py-1.5 px-3">
        <app-icon name="bolt" size="w-4 h-4" class="text-[#FF4F00] animate-pulse"></app-icon>
        <span class="font-label text-xs tracking-wider">
          ENERGY: <strong class="text-[#0E4C92] dark:text-[#60A5FA]">{{ energy() }}/{{ maxEnergy() }}</strong>
        </span>
      </div>
      <div class="badge-brutal bg-[#C0C0C0] dark:bg-[#373A46] text-[#222222] dark:text-[#F3F4F6] flex items-center gap-1.5 py-1.5 px-3 font-label text-xs">
        <app-icon name="cpu-chip" size="w-3.5 h-3.5"></app-icon>
        <span>STOCKFISH 18</span>
      </div>
    </div>

    <!-- Actions Area -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button type="button" class="btn-brutal btn-brutal-silver !py-1.5 !px-3 text-xs sm:text-sm hidden lg:inline-flex items-center gap-1.5">
        <app-icon name="lifebuoy" size="w-4 h-4"></app-icon>
        <span>SUPPORT</span>
      </button>

      <button type="button" class="btn-brutal btn-brutal-silver !py-1.5 !px-3 text-xs sm:text-sm hidden sm:inline-flex items-center gap-1.5">
        <app-icon name="puzzle-piece" size="w-4 h-4"></app-icon>
        <span>EXTENSION</span>
      </button>

      <button type="button" class="btn-brutal btn-brutal-orange !py-1.5 !px-3.5 text-xs sm:text-sm flex items-center gap-1.5">
        <app-icon name="star" size="w-4 h-4"></app-icon>
        <span>PRO</span>
      </button>

      <!-- Account Button -->
      <button type="button" (click)="toggleUserMenu()"
        class="btn-brutal btn-brutal-blue !py-1.5 !px-3 text-xs sm:text-sm flex items-center gap-1.5">
        <app-icon name="user" size="w-4 h-4"></app-icon>
        <span>SIGN IN</span>
      </button>
    </div>
  </div>
</header>
