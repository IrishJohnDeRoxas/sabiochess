<header
  class="w-full bg-[#FFFFFF] dark:bg-[#1E1F24] border-b-[4px] border-[#222222] dark:border-black shadow-[0_4px_0_0_#222222] dark:shadow-[0_4px_0_0_#000000] px-4 py-3 sm:px-6 lg:px-8 transition-colors duration-150 relative z-30">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
    <!-- Brand / Logo Area -->
    <app-logo size="md"></app-logo>

    <!-- Center / Status (Unlimited & Engine) -->
    <div class="hidden md:flex items-center gap-3">
      <!-- 100% Free Unlimited Badge -->
      <div class="badge-brutal bg-[#00D084] text-[#141519] flex items-center gap-1.5 py-1.5 px-3 font-label text-xs sm:text-sm font-bold shadow-[2px_2px_0_0_#222222] dark:shadow-[2px_2px_0_0_#000000]">
        <app-icon name="bolt" size="w-4 h-4"></app-icon>
        <span>100% FREE &amp; UNLIMITED</span>
      </div>

      <!-- Stockfish Version Badge -->
      <div class="badge-brutal bg-[#D9D9D9] dark:bg-[#373A46] text-[#222222] dark:text-[#F3F4F6] flex items-center gap-1.5 py-1.5 px-3 font-label text-xs sm:text-sm font-bold">
        <app-icon name="cpu-chip" size="w-4 h-4"></app-icon>
        <span>STOCKFISH 18 WASM</span>
      </div>
    </div>

    <!-- Actions Area -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Theme Toggle Button -->
      <button type="button" (click)="toggleTheme()"
        class="btn-brutal btn-brutal-silver !py-1.5 sm:!py-2 !px-2.5 sm:!px-3 text-xs sm:text-sm flex items-center justify-center cursor-pointer"
        [title]="settings.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        aria-label="Toggle Theme">
        <app-icon [name]="settings.isDarkMode() ? 'sun' : 'moon'" size="w-4 h-4"></app-icon>
      </button>

      <!-- Buy Me a Coffee Button (Neubrutalist Yellow) -->
      <button type="button" (click)="openSupportModal()"
        class="btn-brutal btn-brutal-yellow !text-[#141519] dark:!text-[#141519] !py-1.5 sm:!py-2 !px-3.5 sm:!px-4 text-xs sm:text-sm flex items-center gap-1.5 font-accent font-black cursor-pointer shadow-[3px_3px_0_0_#222222] dark:shadow-[3px_3px_0_0_#000000] active:translate-x-0.5 active:translate-y-0.5 transition-all">
        <span class="text-sm">☕</span>
        <span class="!text-[#141519] dark:!text-[#141519]">BUY ME A COFFEE</span>
      </button>
    </div>
  </div>
</header>
