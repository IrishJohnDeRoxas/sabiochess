<main class="analyzer-main flex-1 flex flex-col justify-center">

  <!-- Arena Grid Layout -->
  <div class="arena-grid grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 items-start lg:items-stretch my-auto w-full">

    <!-- Board Area: Top Player + [Eval Bar + Chess Board] + Bottom Player (lg:col-span-7) -->
    <div class="lg:col-span-7 flex flex-col gap-2.5 sm:gap-3 w-full max-w-[640px] mx-auto lg:max-w-none animate-drop-in-tl-delay-1">

      <!-- Top Player Card -->
      <app-player-card
        class="block"
        [player]="game.topPlayer()"
        [color]="game.topColor()"
        [isTurn]="game.isTopTurn()"
        [clock]="game.topClock()"
        [outcome]="game.topOutcome()"
      ></app-player-card>

      <!-- Board Row: Eval Bar + Chess Board (matching exact height) -->
      <div class="grid gap-2.5 sm:gap-3 items-stretch w-full"
        [ngClass]="settings.showEvalBar() ? 'grid-cols-[36px_1fr] sm:grid-cols-[44px_1fr]' : 'grid-cols-1'">
        <!-- Eval Bar Column -->
        @if (settings.showEvalBar()) {
        <div class="w-full h-full min-h-0 relative">
          <app-eval-bar class="w-full h-full block"></app-eval-bar>
        </div>
        }

        <!-- Main Chess Board -->
        <div class="w-full min-w-0">
          <app-chess-board></app-chess-board>
        </div>
      </div>

      <!-- Bottom Player Card -->
      <app-player-card
        class="block"
        [player]="game.bottomPlayer()"
        [color]="game.bottomColor()"
        [isTurn]="game.isBottomTurn()"
        [clock]="game.bottomClock()"
        [outcome]="game.bottomOutcome()"
      ></app-player-card>

      <!-- Mobile Quick Move Navigation Bar (Easy thumb reach on mobile screens) -->
      @if (game.history().length > 0) {
      <div class="grid grid-cols-6 lg:hidden gap-1.5 p-1.5 bg-white dark:bg-[#1E1E1E] border-2 border-[#222222] dark:border-black shadow-[3px_3px_0_0_#222222] dark:shadow-[3px_3px_0_0_#000000] w-full">
        <!-- First Move -->
        <button
          type="button"
          (click)="game.goToStart()"
          [disabled]="!game.canUndo()"
          class="btn-brutal btn-brutal-silver !py-2 !px-0 text-xs font-bold flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer"
          title="First Move"
          aria-label="First Move"
        >
          <app-icon name="chevron-double-left" size="w-4 h-4"></app-icon>
        </button>

        <!-- Previous Move -->
        <button
          type="button"
          (click)="game.prevMove()"
          [disabled]="!game.canUndo()"
          class="btn-brutal btn-brutal-silver !py-2 !px-0 text-xs font-bold flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer"
          title="Previous Move"
          aria-label="Previous Move"
        >
          <app-icon name="chevron-left" size="w-4 h-4"></app-icon>
        </button>

        <!-- Flip Board -->
        <button
          type="button"
          (click)="game.flipBoard()"
          class="btn-brutal btn-brutal-silver !py-2 !px-0 text-xs font-bold flex items-center justify-center cursor-pointer"
          title="Flip Board"
          aria-label="Flip Board"
        >
          <app-icon name="arrow-path" size="w-4 h-4"></app-icon>
        </button>

        <!-- Autoplay / Play-Pause -->
        <button
          type="button"
          (click)="game.toggleAutoplay()"
          class="btn-brutal btn-brutal-orange !py-2 !px-0 text-xs font-bold flex items-center justify-center cursor-pointer"
          [title]="game.isAutoplaying() ? 'Pause Autoplay' : 'Play Moves'"
          [attr.aria-label]="game.isAutoplaying() ? 'Pause Autoplay' : 'Play Moves'"
        >
          <app-icon [name]="game.isAutoplaying() ? 'pause' : 'play'" size="w-4 h-4"></app-icon>
        </button>

        <!-- Next Move -->
        <button
          type="button"
          (click)="game.nextMove()"
          [disabled]="!game.canRedo()"
          class="btn-brutal btn-brutal-silver !py-2 !px-0 text-xs font-bold flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer shadow-[2px_2px_0_0_#222222] dark:shadow-[2px_2px_0_0_#000000]"
          title="Next Move"
          aria-label="Next Move"
        >
          <app-icon name="chevron-right" size="w-4 h-4"></app-icon>
        </button>

        <!-- Last Move -->
        <button
          type="button"
          (click)="game.goToEnd()"
          [disabled]="!game.canRedo()"
          class="btn-brutal btn-brutal-silver !py-2 !px-0 text-xs font-bold flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer"
          title="Last Move"
          aria-label="Last Move"
        >
          <app-icon name="chevron-double-right" size="w-4 h-4"></app-icon>
        </button>
      </div>
      }

    </div>

    <!-- Sidebar Tabs (lg:col-span-5): Review, Analysis, Settings -->
    <div class="lg:col-span-5 w-full max-w-[640px] mx-auto lg:max-w-none relative h-auto lg:h-auto animate-drop-in-tl">
      <div class="lg:absolute lg:inset-0 flex flex-col min-h-0 relative h-auto lg:h-full">
        <app-sidebar-tabs class="w-full h-auto lg:h-full min-h-0 flex flex-col"></app-sidebar-tabs>
      </div>
    </div>

  </div>

</main>
