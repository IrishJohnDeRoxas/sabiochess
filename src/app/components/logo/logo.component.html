<div class="inline-flex items-center gap-2.5 sm:gap-3 group" [class.cursor-pointer]="interactive()">
  <!-- Neubrutalist Pawn Badge Mark -->
  <div
    class="bg-[#FF4F00] border-[#222222] flex items-center justify-center font-display text-white rotate-[-2deg] select-none group-hover:rotate-0 transition-all duration-150 active:translate-x-[2px] active:translate-y-[2px] shrink-0"
    [ngClass]="boxSizeClass()">
    <!-- Vector Neubrutalist Pawn Silhouette -->
    <svg 
      [attr.width]="pawnSvgSize()" 
      [attr.height]="pawnSvgSize()" 
      viewBox="0 0 45 45" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg"
      class="filter drop-shadow-[0_1px_0_rgba(0,0,0,0.15)]">
      <path 
        d="M22.5 7.5
           C20 7.5 18 9.5 18 12
           C18 13.1 18.4 14.1 19 14.9
           C16.8 16.2 15.5 18.5 15.5 21.2
           C15.5 23.4 16.5 25.3 18.1 26.6
           C14.8 27.8 10 32.5 10 40.5
           L35 40.5
           C35 32.5 30.2 27.8 26.9 26.6
           C28.5 25.3 29.5 23.4 29.5 21.2
           C29.5 18.5 28.2 16.2 26 14.9
           C26.6 14.1 27 13.1 27 12
           C27 9.5 25 7.5 22.5 7.5 Z"
        fill="#FFFFFF" 
        stroke="#222222" 
        stroke-width="2.2" 
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <!-- Base accent line -->
      <line x1="12" y1="39" x2="33" y2="39" stroke="#222222" stroke-width="2" stroke-linecap="round" />
    </svg>
  </div>

  <!-- Brand Typography -->
  @if (showText()) {
    <div class="flex flex-col justify-center">
      <span class="font-display text-[#222222] dark:text-[#F3F4F6] uppercase select-none leading-none tracking-tight" [ngClass]="textClass()">
        Sabio<span class="text-[#FF4F00]">Chess</span>
      </span>
      @if (showSubtitle()) {
        <span class="font-label text-[10px] text-[#222222] dark:text-[#F3F4F6] opacity-80 uppercase tracking-wider block mt-1">
          Neubrutalist Analysis
        </span>
      }
    </div>
  }
</div>
