<div
  class="min-h-screen flex flex-col bg-[#D9D9D9] dark:bg-[#141519] text-[#222222] dark:text-[#F3F4F6] transition-colors duration-200">

  <!-- Top Announcement Bar (Option 1) -->
  @if (!settings.isExtensionBannerDismissed() && !settings.isEmbedded()) {
    <aside class="hidden md:block w-full bg-[#0E4C92] text-white border-b-2 border-[#222222] dark:border-black px-3 py-1.5 sm:py-2 text-xs font-accent transition-colors relative z-40">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span class="p-1 bg-[#FF4F00] text-white border border-[#222222] shrink-0 font-black shadow-[1px_1px_0_0_#222222]">
            <app-icon name="puzzle-piece" size="w-3.5 h-3.5"></app-icon>
          </span>
          <span class="font-bold tracking-tight truncate">
            <span class="hidden sm:inline font-extrabold uppercase">1-CLICK CHESS REVIEW:</span> Install official SabioChess extension on Chess.com &amp; Lichess!
          </span>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <button
            type="button"
            (click)="settings.openExtensionModal()"
            class="btn-brutal btn-brutal-orange !py-1 !px-2.5 text-[11px] sm:text-xs font-accent font-black flex items-center gap-1.5 text-white cursor-pointer shadow-[2px_2px_0_0_#222222] dark:shadow-[2px_2px_0_0_#000000]"
            title="Watch Extension Walkthrough Video"
          >
            <app-icon name="play" size="w-3 h-3 text-white"></app-icon>
            <span>WATCH DEMO</span>
          </button>

          <button
            type="button"
            (click)="settings.dismissExtensionBanner()"
            class="p-1 hover:bg-white/20 text-white/80 hover:text-white transition-colors cursor-pointer border-0 bg-transparent ml-0.5"
            title="Dismiss announcement banner"
            aria-label="Dismiss banner"
          >
            <app-icon name="x-mark" size="w-3.5 h-3.5"></app-icon>
          </button>
        </div>
      </div>
    </aside>
  }

  <!-- Neubrutalist Header -->
  <app-header class="block animate-drop-in-tl-delay-2"></app-header>

  <!-- Main Routed Content (Chess Analyzer, Terms, etc.) -->
  <router-outlet></router-outlet>

  <!-- Support / Buy Me a Coffee Modal -->
  <app-support-modal></app-support-modal>

  <!-- Chrome Extension Tutorial & Install Modal -->
  <app-extension-modal></app-extension-modal>

  <!-- Neubrutalist Footer (Pushed down below the screen fold) -->
  <app-footer class="block mt-auto"></app-footer>
</div>
